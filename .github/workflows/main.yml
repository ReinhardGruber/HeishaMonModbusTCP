name: Build binary

on:
  push:
    branches-ignore:
      - main        # never run on plain main pushes
    tags:
      - '**'        # but DO run on any tag (including tags on main)
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # nightly at 2am UTC

permissions:
  contents: write

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: "http://arduino.esp8266.com/stable/package_esp8266com_index.json https://espressif.github.io/arduino-esp32/package_esp32_dev_index.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Modbus register map
        run: python3 tests/modbus/run_tests.py

      - name: Test rules examples
        run: bash Examples/Rules/run_tests.sh

      - name: Set version env var
        run: echo "GIT_SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        shell: bash

      - name: Set build type env var
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "BUILD_TYPE=Release" >> $GITHUB_ENV
            case "$RELEASE_TAG" in
              *-ModbusTCP) echo "VERSION=$RELEASE_TAG" >> $GITHUB_ENV ;;
              *) echo "VERSION=$RELEASE_TAG-ModbusTCP" >> $GITHUB_ENV ;;
            esac
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_TYPE=Nightly" >> $GITHUB_ENV
            echo "VERSION=4.2.2-ModbusTCP-Nightly-${{ env.GIT_SHORT_SHA }}" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=Alpha" >> $GITHUB_ENV
            echo "VERSION=4.2.2-ModbusTCP-Alpha-${{ env.GIT_SHORT_SHA }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Update version.h
        if: github.ref != 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cd HeishaMon && sed -i 's/#define HEISHAMON_VERSION .*/#define HEISHAMON_VERSION "${{ env.VERSION }}"/' version.h && cat version.h
        shell: bash

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install platform
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install dependencies
        run: arduino-cli lib install ringbuffer pubsubclient arduinojson dallastemperature onewire "Adafruit NeoPixel" eModbus "AsyncTCP"

      - name: Compile Sketch for ESP8266
        run: bash scripts/build_esp8266.sh

      - name: Add MD5 checksum to ESP8266 binary
        run: |
          cd HeishaMon
          MD5=`md5sum HeishaMon.ino.bin | cut -d\  -f1`
          mv HeishaMon.ino.bin HeishaMon_ESP8266-ModbusTCP-${{ env.BUILD_TYPE }}-$MD5.bin
        shell: bash

      - name: Compile Sketch for ESP32
        run: bash scripts/build_esp32s3.sh

      - name: Add MD5 checksum to ESP32 binary
        run: |
          cd HeishaMon
          MD5=`md5sum HeishaMon.ino.bin | cut -d\  -f1`
          mv HeishaMon.ino.bin HeishaMon_ESP32-ModbusTCP-${{ env.BUILD_TYPE }}-$MD5.bin
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Heishamon-firmware-${{ env.BUILD_TYPE }}-${{ env.GIT_SHORT_SHA }}
          path: |
            HeishaMon/HeishaMon_*.bin
            HeishaMon/HeishaMon.ino.map
            binaries/model-type-small/HeishaMon.ino.d1-v${{ env.VERSION }}.*
            binaries/model-type-large/HeishaMon.ino.esp32-v${{ env.VERSION }}.*

      - name: Delete old nightly assets
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          gh release view nightly --json assets --jq '.assets[].name' | \
          xargs -I{} gh release delete-asset nightly {} --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Publish nightly release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build (${{ env.GIT_SHORT_SHA }})"
          body: |
            Automated nightly build from `main` branch.
            Commit: ${{ github.sha }}
            Built: ${{ github.run_id }}
          prerelease: true
          files: HeishaMon/HeishaMon_*.bin

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            Release ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: HeishaMon/HeishaMon_*.bin
